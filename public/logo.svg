<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Card Metallic Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gold Accent for Smart Chip -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Frame -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" stroke="url(#cardGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Holographic Ambient Glow Behind Card -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />

  <!-- Isometric Card Base 1 (Shadow/Stack Layer) -->
  <rect x="110" y="160" width="292" height="182" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="3" transform="rotate(-6 256 251)" opacity="0.6" />

  <!-- Main Card Layer -->
  <g transform="translate(10, 0)">
    <rect x="96" y="146" width="300" height="190" rx="22" fill="#090d16" stroke="url(#cardGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Magnetic Stripe / Card Banner -->
    <path d="M 98 190 L 394 190" stroke="url(#cardGrad)" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Metallic Smart Security Chip -->
    <rect x="130" y="210" width="48" height="38" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
    <path d="M 130 224 L 178 224 M 130 234 L 178 234 M 154 210 L 154 248" stroke="#78350f" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Blockchain Link Hex / Nodes -->
    <circle cx="340" cy="225" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="340" cy="225" r="5" fill="#38bdf8" />
    
    <circle cx="310" cy="265" r="10" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="2" />
    <circle cx="310" cy="265" r="3.5" fill="#818cf8" />

    <circle cx="360" cy="275" r="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="360" cy="275" r="3" fill="#38bdf8" />

    <!-- Connecting Blockchain Vectors -->
    <line x1="334" y1="235" x2="316" y2="255" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="346" y1="237" x2="356" y2="267" stroke="#818cf8" stroke-width="2" />
    <line x1="318" y1="268" x2="352" y2="273" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Identity Card Data Lines -->
    <rect x="130" y="268" width="90" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.9" />
    <rect x="130" y="284" width="130" height="6" rx="3" fill="#64748b" fill-opacity="0.7" />
    <rect x="130" y="298" width="60" height="5" rx="2.5" fill="#38bdf8" />
  </g>

  <!-- Botchain Symbol / Shield Crest Overlay in Top Corner -->
  <g transform="translate(370, 75)">
    <polygon points="25,0 50,15 50,45 25,60 0,45 0,15" fill="#0f172a" stroke="url(#cardGrad)" stroke-width="3" />
    <text x="25" y="38" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="22" fill="#38bdf8">968</text>
  </g>
</svg>
